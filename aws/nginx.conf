# ========================================================
# Production Nginx Reverse Proxy Configuration for AWS EC2
# For Lost & Found Application Backend & Frontend
# ========================================================

server {
    listen 80;
    server_name your-ec2-domain-or-ip.compute.amazonaws.com;

    # For SSL certification with Let's Encrypt / Certbot:
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS (for production)
    # return 301 https://$host$request_uri;

    # Backend API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Upload file size limit (5MB to match Multer)
        client_max_body_size 6M;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://127.0.0.1:5000/api/health;
        proxy_http_version 1.1;
    }
}
